version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Use pip to update build-system.requires without rewriting uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "uv-build"
    versioning-strategy: "widen"
    commit-message:
      prefix: "chore(deps)"

# Runtime deps are upgraded by .github/workflows/uv-lock-upgrade.yml instead:
# dependabot can't update a uv.lock that forks by Python version.
