name: uv-lock-upgrade
on:
  schedule:
  - cron: "0 10 * * 1" # Mondays 10 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
    # Use an app token so the PR triggers CI (GITHUB_TOKEN-created PRs don't)
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token
      with:
        client-id: ${{ secrets.POSIT_CONNECT_PROJECTS_CLIENT_ID }}
        private-key: ${{ secrets.POSIT_CONNECT_PROJECTS_PEM }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Upgrade uv.lock
      id: upgrade
      run: |
        {
          echo 'summary<<EOF'
          uv lock --upgrade 2>&1
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: uv-lock-upgrade
        delete-branch: true
        commit-message: "chore(deps): upgrade uv.lock"
        title: "chore(deps): upgrade uv.lock"
        body: |
          Automated `uv lock --upgrade`. Dependabot can't update this lockfile because it
          resolves different versions per Python version (`requires-python = ">=3.8"`).

          ```
          ${{ steps.upgrade.outputs.summary }}
          ```
        add-paths: uv.lock
